name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: 质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: 检查格式
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 漏洞检查
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Race 测试
        run: go test -race -coverprofile=coverage.out ./...

      - name: 运行 Coding baseline
        run: go run ./cmd/mengdie-eval baseline --manifest evals/coding/smoke.json

      - name: 随机故障注入评测
        run: |
          mkdir -p evidence
          go run ./cmd/mengdie-eval chaos --manifest evals/chaos/all.json --rounds 3 --out evidence/chaos-simulated.json --pretty

      - name: 上传模拟故障证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-simulated-${{ github.run_id }}
          path: evidence/chaos-simulated.json

  test:
    name: 测试 · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: 运行测试
        run: go test ./...

      - name: 离线验证真实 Provider 验收 Harness
        run: go test -tags=liveprovider ./internal/app -run '^(TestInspectCodingEvidenceUsesSuccessfulToolEvents|TestEnvironmentWithoutRemovesCredentialCaseInsensitively|TestValidateWorkspaceChangesRejectsUnrelatedDiff)$' -count=1
