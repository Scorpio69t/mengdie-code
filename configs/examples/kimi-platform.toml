# Kimi 开放平台（中国大陆）OpenAI-compatible 配置示例（核验日期：2026-08-06）。
# 开放平台 Key 只保存在 MOONSHOT_API_KEY 环境变量中，不要写入本文件。
# Kimi 开放平台与 Kimi Code 会员的 Key、端点和额度互不通用。

default_profile = "kimi-platform"

[profiles.kimi-platform]
provider = "openai-compatible"
base_url = "https://api.moonshot.cn/v1"
api_key_env = "MOONSHOT_API_KEY"
model = "kimi-k3"
request_timeout = "120s"
max_context_tokens = 1000000

[approval]
mode = "suggest"
read_project_files = true
allow_commands = ["go test", "go vet", "git status", "git diff"]

[context]
max_tool_output_bytes = 65536
max_turns = 32
